<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style>
    /* Bloco: ocupa a linha inteira */
    div { background: #ddd; margin-bottom: 8px; }

    /* Inline: fica lado a lado */
    span { background: yellow; }
  </style>
</head>
<body>

  <!-- Elementos em Bloco (ficam um embaixo do outro) -->
  <div>Bloco 1</div>
  <div>Bloco 2</div>

  <!-- Elementos Inline (ficam um ao lado do outro) -->
  <p>Texto com <span>Span 1</span> e <span>Span 2</span> na mesma linha.</p>

</body>
</html>
