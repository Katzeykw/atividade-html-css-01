<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Exemplo 1: Alterando a cor do texto e o tamanho da fonte -->
     <h1 style="color: blue; font-size: 32px;">
        Título Principal em Azul
    </h1>
    
    <!-- Exemplo 2: Adicionando cor de fundo e espaçamento interno (padding) -->
     <div style="background-color: #f0f0f0; padding: 15px; border-radius: 8px;">
        <p style="color: green; font-weight: bold;">
             Mensagem de sucesso com fundo cinza!
        </p>
     </div>
     
    <!-- Exemplo 3: Centralizando um parágrafo e ajustando a largura -->
     <p style="text-align: center; max-width: 400px; margin: 0 auto;">
        Este parágrafo está centralizado e com largura limitada.
    </p>
</body>
</html>
