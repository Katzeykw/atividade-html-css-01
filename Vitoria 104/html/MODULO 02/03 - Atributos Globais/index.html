<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- EXEMPLO 1, identificador único para um elemento na página -->
     <h1 id="titulo-principal">Bem-vindo ao site</h1>

    <!-- EXEMPLO 2, associa o elemento a uma ou mais classes do CSS -->
     <p class="texto-destaque">Este parágrafo possui um estilo diferente.</p>

    <!-- EXEMPLO 3, aplica estilos CSS diretamente no elemento -->
     <div style="color: blue; background-color: lightgray;">
        Texto estilizado diretamente.
    </div>

    <!-- EXEMPLO 4, define o idioma do conteúdo do elemento -->
     <p lang="en">Hello, world!</p>

</body>
</html>
