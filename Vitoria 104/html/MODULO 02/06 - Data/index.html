<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Exemplo 1: Armazenando informações de um produto -->
     <div class="produto" data-id="104" data-categoria="eletronicos" data-preco="199.90">
           <h3>Fone de Ouvido Bluetooth</h3>
           <p>R$ 199,90</p>
     </div>
    
     <!-- Exemplo 2: Guardando o estado de um usuário ou botão -->
      <button data-status="ativo" data-usuario-id="42">
        Perfil do Usuário
      </button>
     <!-- Exemplo 3: Usando para filtrar itens em uma lista -->
      <ul>
        
        <li data-filtro="fruta">Maçã</li>
        <li data-filtro="vegetal">Cenoura</li>
        <li data-filtro="fruta">Banana</li>
      </ul>
</body>
</html>
