<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- EXEMPLO 1, desativa um campo de texto ou botão -->
     <input type="text" disabled>

    <!-- EXEMPLO 2, torna o preenchimento de um campo obrigatório -->
     <input type="email" required>

     <!-- EXEMPLO 3, deixa uma caixa de seleção já marcada por padrão -->
      <input type="checkbox" checked>
</body>
</html>
