<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Exemplo 1: Identificando o cabeçalho principal -->
     <header id="cabecalho-principal">
                <h1>Meu Site</h1>
     </header>
    <!-- Exemplo 2: Criando uma seção que pode ser acessada por link -->
     <section id="sobre-mim">
        <h2>Sobre Mim</h2>
        <p>Eu sou um estudante aprendendo HTML!</p>
     </section>
    <!-- Link que rola a página direto para a seção acima -->
     <a href="#sobre-mim">Ir para a seção Sobre Mim</a>
</body>
</html>
