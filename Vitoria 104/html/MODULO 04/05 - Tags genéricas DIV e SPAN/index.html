<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Exemplo genérico -->
    <style>
        .caixa {
            background-color: #f0f0f0;
            padding: 15px;
            border: 1px solid #ccc;
        }
        .destaque {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<BODY>


    <!-- div agrupa o bloco inteiro -->
    <div class="caixa">
        <p>Este parágrafo está dentro de uma div. A palavra <span class="destaque">específica</span> foi destacada com um span.</p>
    </div>

    <!-- Exemplo temático: Cartão de Estatísticas Pokémon (Lucario) -->
     <head>
    <style>
        .pokemon-box {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            font-family: Arial, sans-serif;
        }
        .badge-lutador {
            background-color: #d35400;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .badge-metal {
            background-color: #7f8c8d;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .stat-value {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>


    <!-- div cria o bloco contêiner do cartão -->
    <div class="pokemon-box">
        <h3>Lucario #0448</h3>
        
        <!-- spans estilizam os tipos sem quebrar a linha -->
        <p>
            Tipo: 
            <span class="badge-lutador">Lutador</span> 
            <span class="badge-metal">Metal</span>
        </p>

        <hr>

        <!-- spans destacam apenas os números das estatísticas -->
        <p>Ataque: <span class="stat-value">110</span></p>
        <p>Defesa: <span class="stat-value">70</span></p>
        <p>Velocidade: <span class="stat-value">90</span></p>
    </div>

</body>
</html>
