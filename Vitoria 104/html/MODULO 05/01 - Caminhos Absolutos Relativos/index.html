<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Exemplos Práticos em HTML -->
      <!-- Caminho Absoluto (Imagem da Web):-->
         <!-- Busca uma imagem direto do servidor oficial da web -->
              <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png" alt="Pikachu">

      <!-- Caminho Relativo - Mesma pasta ou pasta filha:-->
         <!-- Se você estiver editando o arquivo index.html e quiser colocar a imagem do Pikachu:-->
          <!-- Entra na pasta imagens/ a partir do index.html -->
             <img src="imagens/pikachu.png" alt="Pikachu">

      <!-- Caminho Relativo - Subir uma pasta (../): -->
         <!-- Se você estiver editando o arquivo paginas/pikachu.html e precisar usar a imagem que está na pasta de imagens:-->
          <!-- O ../ sai da pasta 'paginas' e entra na pasta 'imagens' -->
             <img src="../imagens/pikachu.png" alt="Pikachu">
             
</body>
</html>
