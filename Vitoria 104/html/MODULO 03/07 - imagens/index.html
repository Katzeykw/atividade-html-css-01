<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Galeria de Iniciais de Kanto</h2>

    <!-- Exemplo 1: Imagem com link externo e atributo alt bem detalhado -->
    <div>
        <h3>Bulbasaur</h3>
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png" 
             alt="Bulbasaur verde sorrindo com um bulbo nas costas" 
             width="200">
    </div>

    <!-- Exemplo 2: Ajustando tamanho com largura (width) e altura (height) -->
    <div>
        <h3>Squirtle</h3>
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png" 
             alt="Squirtle de pé com sua concha azul e marrom" 
             width="150" 
             height="150">
    </div>

    <!-- Exemplo 3: Imagem encapsulada em um hiperlink (clicável) -->
    <div>
        <h3>Charizard</h3>
        <p>Clique na imagem abaixo para visitar a Pokédex oficial:</p>
        <a href="https://www.pokemon.com/br/pokedex/charizard" target="_blank">
            <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/006.png" 
                 alt="Charizard soltando fogo pela boca" 
                 width="200">
        </a>
    </div>

</body>
</html>
