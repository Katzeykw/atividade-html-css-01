<body>
    <!-- EXEMPLO 1: Usada quando a ordem dos itens não importa -->
     <ul>
         <li>Café</li>
         <li>Leite</li>
         <li>Pão</li>
     </ul>
    
    <!-- EXEMPLO 2: Usada quando a sequência é importante -->
     <ol>
         <li>Lavar as mãos</li>
         <li>Pegar a frigideira</li>
         <li>Fritar o ovo</li>
     </ol>
    
    <!-- EXEMPLO 3: colocar uma lista dentro de outra para criar subitens -->
     <ul>
  <li>Frutas
    <ul>
      <li>Maçã</li>
      <li>Banana</li>
    </ul>
  </li>
  <li>Bebidas</li>
</ul>

    <!-- EXEMPLO 4: com pokémon, os três em um -->
     <!-- Lista não ordenada: habilidades -->
      <ul>
         <li>Intimidate</li>
         <li>Rivalry</li>
         <li>Guts</li>
      </ul>
    <!-- Lista Ordenada: Linha Evolutiva -->
     <ol>
         <li>Shinx</li>
         <li>Luxio</li>
         <li>Luxray</li>
     </ol>
    <!-- Lista Aninhada: Golpes -->
     <ul>
        <li>Tipo Elétrico
             <ul>
                 <li>Wild Charge</li>
                 <li>Volt Tackle</li>
             </ul>
         </li>
        <li>Tipo Sombrio
             <ul>
                 <li>Crunch</li>
                 <li>Bite</li>
             </ul>
         </li>
     </ul>

</body>
